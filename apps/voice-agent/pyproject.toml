[project]
name = "thinktogether-voice"
version = "0.1.0"
description = "One consent-gated LiveKit voice facilitator per ThinkTogether cohort room"
requires-python = ">=3.13,<3.14"
dependencies = [
  "livekit-agents==1.8.10",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thinktogether_voice*"]
