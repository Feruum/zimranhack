# Independent deployment file. Do not merge with the local compose file.
# TLS terminates at an operator-managed reverse proxy on the same host; only the
# loopback gateway is published. Change the bind only with a trusted network plan.
name: thinktogether-production

x-api: &api
  image: ${TT_IMAGE_PREFIX:?set TT_IMAGE_PREFIX}-api:${TT_RELEASE:?set TT_RELEASE}
  env_file: ${TT_ENV_FILE:-../../.learnhouse/thinktogether-production.env}
  restart: unless-stopped
  init: true
  volumes:
    - scratch:/app/api/content
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    <<: *api
    environment:
      LEARNHOUSE_AUTO_MIGRATE: "false"

  worker:
    <<: *api
    command: [/app/api/.venv/bin/python, -m, src.services.thinktogether.jobs_worker, worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    <<: *api
    command: [/app/api/.venv/bin/python, -m, src.services.thinktogether.jobs_worker, scheduler]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  # Run deliberately before an existing stamped database's new API release.
  # Fresh installations require the one-time bootstrap described in RUNBOOK.md.
  migrate:
    <<: *api
    profiles: [operations]
    restart: "no"
    command: [/app/api/.venv/bin/python, -m, alembic, upgrade, head]
    environment:
      LEARNHOUSE_SQL_CONNECTION_STRING: ${TT_MIGRATION_DATABASE_URL:-}
    healthcheck:
      disable: true

  collab:
    image: ${TT_IMAGE_PREFIX:?set TT_IMAGE_PREFIX}-collab:${TT_RELEASE:?set TT_RELEASE}
    env_file: ${TT_ENV_FILE:-../../.learnhouse/thinktogether-production.env}
    environment:
      TT_ENABLED: "true"
      LEARNHOUSE_API_URL: http://api:9000
      COLLAB_PORT: 4000
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${TT_IMAGE_PREFIX:?set TT_IMAGE_PREFIX}-web:${TT_RELEASE:?set TT_RELEASE}
    env_file: ${TT_ENV_FILE:-../../.learnhouse/thinktogether-production.env}
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      LEARNHOUSE_INTERNAL_API_URL: http://api:9000
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  voice-agent:
    image: ${TT_IMAGE_PREFIX:?set TT_IMAGE_PREFIX}-voice:${TT_RELEASE:?set TT_RELEASE}
    env_file: ${TT_ENV_FILE:-../../.learnhouse/thinktogether-production.env}
    environment:
      TT_API_URL: http://api:9000/api/v1/tt
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TT_GATEWAY_PORT:-8096}:80"
    volumes:
      - ./production.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - collab
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  scratch:
  redis:
