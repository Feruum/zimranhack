# Trusted TLS reverse proxy -> loopback-published gateway -> application.
# The outer proxy must overwrite Host/X-Forwarded-For and support WebSockets.
map $http_upgrade $tt_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $tt_api http://api:9000;
    set $tt_web http://web:3000;
    set $tt_collab http://collab:4000;
    client_max_body_size 6G;
    large_client_header_buffers 4 32k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tt_connection;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    location /api/v1/ { proxy_pass $tt_api; }
    location /content/ { proxy_pass $tt_api; }
    location /collab { proxy_pass $tt_collab; }
    location / { proxy_pass $tt_web; }
}
